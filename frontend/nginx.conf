server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA (React Router): qualquer rota cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash do Vite podem ser cacheados por muito tempo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
