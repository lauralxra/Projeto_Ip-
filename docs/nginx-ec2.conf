# =============================================================================
# Nginx — Configuração de Produção para Projeto Ipê na EC2
# =============================================================================
#
# Arquivo de referência: copie para /etc/nginx/sites-available/projeto-ipe
# na EC2 e crie o symlink:
#   sudo ln -s /etc/nginx/sites-available/projeto-ipe /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Pré-requisito — certificados SSL com Certbot:
#   sudo certbot --nginx -d projetoipe.duckdns.org -d api-projetoipe.duckdns.org
#
# Containers Docker esperados (docker-compose.prod.yml):
#   - API NestJS  → localhost:3000
#   - Frontend    → localhost:8080
# =============================================================================


# ─── REDIRECT HTTP → HTTPS ────────────────────────────────────────────────────
server {
    listen 80;
    server_name projetoipe.duckdns.org api-projetoipe.duckdns.org;
    return 301 https://$host$request_uri;
}


# ─── FRONTEND — projetoipe.duckdns.org ────────────────────────────────────────
server {
    listen 443 ssl;
    server_name projetoipe.duckdns.org;

    # Certificados gerados pelo Certbot (ajuste os caminhos se necessário)
    ssl_certificate     /etc/letsencrypt/live/projetoipe.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/projetoipe.duckdns.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}


# ─── API — api-projetoipe.duckdns.org ─────────────────────────────────────────
server {
    listen 443 ssl;
    server_name api-projetoipe.duckdns.org;

    # Certificados gerados pelo Certbot
    ssl_certificate     /etc/letsencrypt/live/api-projetoipe.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-projetoipe.duckdns.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Tamanho máximo de upload (maior que o limite do NestJS: 5 MB) ──────────
    client_max_body_size 10M;

    # ── Rota de uploads estáticos — CRÍTICO para imagens funcionarem ──────────
    # O NestJS serve /api/uploads/* como arquivos estáticos.
    # Aumentamos os timeouts para não cortar o envio da imagem.
    location /api/uploads/ {
        proxy_pass         http://127.0.0.1:3000/api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Cache de imagens no browser por 7 dias
        add_header Cache-Control "public, max-age=604800, immutable";
        expires 7d;
    }

    # ── Todas as outras rotas da API ──────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeout generoso para uploads de arquivo
        proxy_read_timeout    120s;
        proxy_connect_timeout 60s;
        proxy_send_timeout    120s;
    }
}
